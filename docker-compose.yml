version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: api-fake-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apifake
    ports:
      - "5416:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apifake"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: api-fake-dashboard
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/apifake?schema=public
      NODE_ENV: production
      JWT_SECRET: super-secret-random-key-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: api-fake-gateway
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/apifake?schema=public
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: api-fake-proxy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - dashboard
      - gateway

volumes:
  pgdata:
